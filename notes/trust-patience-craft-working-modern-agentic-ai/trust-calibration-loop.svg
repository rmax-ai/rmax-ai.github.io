<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Trust Calibration Loop</title>
  <desc id="desc">A loop showing: define constraints, agent executes, verify evidence, adjust autonomy and constraints, then repeat.</desc>

  <defs>
    <style>
      .bg { fill: transparent; }
      .box { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.28); stroke-width: 2; }
      .title { font: 600 18px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: rgba(255,255,255,0.92); }
      .label { font: 500 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: rgba(255,255,255,0.86); }
      .muted { font: 400 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: rgba(255,255,255,0.62); }
      .arrow { stroke: rgba(255,255,255,0.55); stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="rgba(255,255,255,0.55)" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="360" />

  <text class="title" x="48" y="54">Trust calibration loop (operator + agent)</text>
  <text class="muted" x="48" y="78">Goal: appropriate reliance via constraints, evidence, and gated autonomy.</text>

  <!-- Boxes -->
  <rect class="box" x="70" y="120" rx="14" ry="14" width="190" height="96" />
  <text class="label" x="95" y="155">1) Define constraints</text>
  <text class="muted" x="95" y="178">Scope, stop rules,</text>
  <text class="muted" x="95" y="196">acceptance criteria</text>

  <rect class="box" x="290" y="120" rx="14" ry="14" width="190" height="96" />
  <text class="label" x="315" y="155">2) Agent executes</text>
  <text class="muted" x="315" y="178">Diffs, drafts, runs</text>
  <text class="muted" x="315" y="196">tasks within bounds</text>

  <rect class="box" x="510" y="120" rx="14" ry="14" width="190" height="96" />
  <text class="label" x="535" y="155">3) Verify evidence</text>
  <text class="muted" x="535" y="178">Tests, traces, links,</text>
  <text class="muted" x="535" y="196">schema validation</text>

  <rect class="box" x="730" y="120" rx="14" ry="14" width="190" height="96" />
  <text class="label" x="755" y="155">4) Adjust autonomy</text>
  <text class="muted" x="755" y="178">Tighten/relax gates,</text>
  <text class="muted" x="755" y="196">update playbook</text>

  <!-- Arrows -->
  <path class="arrow" d="M260 168 L290 168" />
  <path class="arrow" d="M480 168 L510 168" />
  <path class="arrow" d="M700 168 L730 168" />
  <path class="arrow" d="M825 216 C825 290, 160 290, 160 216" />

  <text class="muted" x="392" y="320">Repeat until the pipeline is predictable and the trust is calibrated.</text>
</svg>
