<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 824" width="380" height="824" role="img" aria-labelledby="f2m-t f2m-d" style="font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="f2m-t">Control loop: human authority, durable GitHub state, bounded agent execution, acceptance gate, independent review, and disposition</title><desc id="f2m-d">Seven stages stacked vertically. Failed checks return the attempt to the execution lane. Adoption of a verified result into the next task is not consistently enforced.</desc><rect width="380" height="824" rx="10" fill="#0b1220"/><rect x="0.5" y="0.5" width="379" height="823" rx="10" fill="none" stroke="#1e293b"/><text x="22" y="38" font-size="14" font-weight="600" fill="#e6eef8">Where authority, execution and evidence live</text><text x="22" y="58" font-size="11" fill="#94a3b8">One pass through the loop.</text><rect x="22" y="88" width="336" height="76" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="22" y="88" width="3" height="76" rx="1.5" fill="#fbbf24"/><text x="36" y="106" font-size="10" font-weight="600" fill="#fbbf24">1</text><text x="48" y="106" font-size="12" font-weight="600" fill="#e6eef8">Operator</text><text x="36.0" y="122.0" font-size="10.4" fill="#94a3b8" text-anchor="start">Scope, authority, and final approval of consequential</text><text x="36.0" y="136.0" font-size="10.4" fill="#94a3b8" text-anchor="start">actions.</text><text x="348" y="106" font-size="8.5" fill="#fbbf24" text-anchor="end">HUMAN DECISION</text><rect x="22" y="176" width="336" height="76" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="22" y="176" width="3" height="76" rx="1.5" fill="#8b5cf6"/><text x="36" y="194" font-size="10" font-weight="600" fill="#8b5cf6">2</text><text x="48" y="194" font-size="12" font-weight="600" fill="#e6eef8">GitHub task state</text><text x="36.0" y="210.0" font-size="10.4" fill="#94a3b8" text-anchor="start">Issue carries the task, owner, claims, implementation</text><text x="36.0" y="224.0" font-size="10.4" fill="#94a3b8" text-anchor="start">artifacts, and review history.</text><text x="348" y="194" font-size="8.5" fill="#8b5cf6" text-anchor="end">DURABLE STATE</text><rect x="22" y="264" width="336" height="76" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="22" y="264" width="3" height="76" rx="1.5" fill="#60a5fa"/><text x="36" y="282" font-size="10" font-weight="600" fill="#60a5fa">3</text><text x="48" y="282" font-size="12" font-weight="600" fill="#e6eef8">Orchestrator</text><text x="36.0" y="298.0" font-size="10.4" fill="#94a3b8" text-anchor="start">Selects eligible work, dispatches one bounded attempt,</text><text x="36.0" y="312.0" font-size="10.4" fill="#94a3b8" text-anchor="start">records findings and next owner.</text><text x="348" y="282" font-size="8.5" fill="#60a5fa" text-anchor="end">AUTOMATION</text><rect x="22" y="352" width="336" height="76" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="22" y="352" width="3" height="76" rx="1.5" fill="#60a5fa"/><text x="36" y="370" font-size="10" font-weight="600" fill="#60a5fa">4</text><text x="48" y="370" font-size="12" font-weight="600" fill="#e6eef8">Execution lane</text><text x="36.0" y="386.0" font-size="10.4" fill="#94a3b8" text-anchor="start">Coding agent works inside a bounded attempt and returns a</text><text x="36.0" y="400.0" font-size="10.4" fill="#94a3b8" text-anchor="start">branch, change, and evidence.</text><text x="348" y="370" font-size="8.5" fill="#60a5fa" text-anchor="end">AUTOMATION</text><rect x="22" y="440" width="336" height="76" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="22" y="440" width="3" height="76" rx="1.5" fill="#34d399"/><text x="36" y="458" font-size="10" font-weight="600" fill="#34d399">5</text><text x="48" y="458" font-size="12" font-weight="600" fill="#e6eef8">Acceptance gate</text><text x="36.0" y="474.0" font-size="10.4" fill="#94a3b8" text-anchor="start">A command with an expected result runs against the change;</text><text x="36.0" y="488.0" font-size="10.4" fill="#94a3b8" text-anchor="start">the evidence attaches to the pull request.</text><text x="348" y="458" font-size="8.5" fill="#34d399" text-anchor="end">AUTOMATION</text><text x="36" y="510" font-size="9" fill="#f87171">A failed check returns the attempt to stage 4.</text><rect x="22" y="528" width="336" height="76" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="22" y="528" width="3" height="76" rx="1.5" fill="#60a5fa"/><text x="36" y="546" font-size="10" font-weight="600" fill="#60a5fa">6</text><text x="48" y="546" font-size="12" font-weight="600" fill="#e6eef8">Independent review</text><text x="36.0" y="562.0" font-size="10.4" fill="#94a3b8" text-anchor="start">A second model and, where risk warrants, the operator</text><text x="36.0" y="576.0" font-size="10.4" fill="#94a3b8" text-anchor="start">return a verdict bound to an exact revision.</text><text x="348" y="546" font-size="8.5" fill="#60a5fa" text-anchor="end">REVIEW</text><rect x="22" y="616" width="336" height="76" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="22" y="616" width="3" height="76" rx="1.5" fill="#8b5cf6"/><text x="36" y="634" font-size="10" font-weight="600" fill="#8b5cf6">7</text><text x="48" y="634" font-size="12" font-weight="600" fill="#e6eef8">Disposition</text><text x="36.0" y="650.0" font-size="10.4" fill="#94a3b8" text-anchor="start">The outcome is recorded with a next owner: verified,</text><text x="36.0" y="664.0" font-size="10.4" fill="#94a3b8" text-anchor="start">delegated, deferred, or closed with a reason.</text><text x="348" y="634" font-size="8.5" fill="#8b5cf6" text-anchor="end">DURABLE STATE</text><rect x="22" y="722" width="336" height="86" rx="7" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.45"/><text x="34" y="740" font-size="10.5" font-weight="600" fill="#fbbf24">Not enforced today</text><text x="34.0" y="755.0" font-size="10.0" fill="#94a3b8" text-anchor="start">A verified result does not reliably change the next task's</text><text x="34.0" y="768.0" font-size="10.0" fill="#94a3b8" text-anchor="start">acceptance criteria or the skill that produced it. Stage 7</text><text x="34.0" y="781.0" font-size="10.0" fill="#94a3b8" text-anchor="start">reaches stage 2 only when a human or the orchestrator makes</text><text x="34.0" y="794.0" font-size="10.0" fill="#94a3b8" text-anchor="start">that link deliberately.</text></svg>
