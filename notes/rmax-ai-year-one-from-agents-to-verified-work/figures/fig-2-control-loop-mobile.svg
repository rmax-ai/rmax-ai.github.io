<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 640" width="380" height="640" role="img" aria-labelledby="architecture-t architecture-d" style="font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="architecture-t">From scope to merge approval</title><desc id="architecture-d">The operator authorizes scope. GitHub and rmax-10 coordinate an attempt. Execution, local checks and review return evidence for the merge decision. A dashed arrow proposes a new task after disposition.</desc><rect width="380" height="640" rx="10" fill="#0b1220"/><rect x="0.5" y="0.5" width="379" height="639" rx="10" fill="none" stroke="#1e293b"/>
