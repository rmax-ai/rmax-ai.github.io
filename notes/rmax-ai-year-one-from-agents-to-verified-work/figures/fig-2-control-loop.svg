<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="f2w-t f2w-d" style="font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="f2w-t">Control loop: human authority, durable GitHub state, bounded agent execution, acceptance gate, independent review, and disposition</title><desc id="f2w-d">Seven documented responsibilities. The dashed red return runs from the acceptance gate to execution for a retry. The dotted amber return from disposition to GitHub task state represents a proposed follow-up.</desc><rect width="760" height="640" rx="10" fill="#0b1220"/><rect x="0.5" y="0.5" width="759" height="639" rx="10" fill="none" stroke="#1e293b"/><text x="30" y="40" font-size="15" font-weight="600" fill="#e6eef8">Where authority, execution and evidence live</text><text x="30" y="60" font-size="11" fill="#94a3b8">One pass through the loop. Both return edges are drawn in the right gutter.</text><line x1="36" y1="92" x2="36" y2="548" stroke="#1e293b"/><rect x="30" y="96" width="636" height="54" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="30" y="96" width="3" height="54" rx="1.5" fill="#fbbf24"/><circle cx="48" cy="122" r="11" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.6"/><text x="48" y="126" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">1</text><text x="74" y="116" font-size="12.5" font-weight="600" fill="#e6eef8">Operator</text><text x="74.0" y="132.0" font-size="10.6" fill="#94a3b8" text-anchor="start">Scope, authority, and final approval of consequential actions.</text><text x="656" y="116" font-size="9.5" fill="#fbbf24" text-anchor="end" letter-spacing="0.3">HUMAN DECISION</text><path d="M36 150 L36 158" stroke="#1e293b" stroke-width="1.5"/><path d="M32.5 154 L36 158.5 L39.5 154" fill="none" stroke="#1e293b" stroke-width="1.5"/><rect x="30" y="160" width="636" height="54" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="30" y="160" width="3" height="54" rx="1.5" fill="#8b5cf6"/><circle cx="48" cy="186" r="11" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.6"/><text x="48" y="190" font-size="11" font-weight="600" fill="#8b5cf6" text-anchor="middle">2</text><text x="74" y="180" font-size="12.5" font-weight="600" fill="#e6eef8">GitHub task state</text><text x="74.0" y="196.0" font-size="10.6" fill="#94a3b8" text-anchor="start">Issue carries the task, owner, claims, implementation artifacts, and review history.</text><text x="656" y="180" font-size="9.5" fill="#8b5cf6" text-anchor="end" letter-spacing="0.3">DURABLE STATE</text><path d="M36 214 L36 222" stroke="#1e293b" stroke-width="1.5"/><path d="M32.5 218 L36 222.5 L39.5 218" fill="none" stroke="#1e293b" stroke-width="1.5"/><rect x="30" y="224" width="636" height="54" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="30" y="224" width="3" height="54" rx="1.5" fill="#60a5fa"/><circle cx="48" cy="250" r="11" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.6"/><text x="48" y="254" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">3</text><text x="74" y="244" font-size="12.5" font-weight="600" fill="#e6eef8">Orchestrator</text><text x="74.0" y="260.0" font-size="10.6" fill="#94a3b8" text-anchor="start">Selects eligible work, dispatches one bounded attempt, records findings and next</text><text x="74.0" y="274.3" font-size="10.6" fill="#94a3b8" text-anchor="start">owner.</text><text x="656" y="244" font-size="9.5" fill="#60a5fa" text-anchor="end" letter-spacing="0.3">AUTOMATION</text><path d="M36 278 L36 286" stroke="#1e293b" stroke-width="1.5"/><path d="M32.5 282 L36 286.5 L39.5 282" fill="none" stroke="#1e293b" stroke-width="1.5"/><rect x="30" y="288" width="636" height="54" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="30" y="288" width="3" height="54" rx="1.5" fill="#60a5fa"/><circle cx="48" cy="314" r="11" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.6"/><text x="48" y="318" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">4</text><text x="74" y="308" font-size="12.5" font-weight="600" fill="#e6eef8">Execution lane</text><text x="74.0" y="324.0" font-size="10.6" fill="#94a3b8" text-anchor="start">Coding agent works inside a bounded attempt and returns a branch, change, and</text><text x="74.0" y="338.3" font-size="10.6" fill="#94a3b8" text-anchor="start">evidence.</text><text x="656" y="308" font-size="9.5" fill="#60a5fa" text-anchor="end" letter-spacing="0.3">AUTOMATION</text><path d="M36 342 L36 350" stroke="#1e293b" stroke-width="1.5"/><path d="M32.5 346 L36 350.5 L39.5 346" fill="none" stroke="#1e293b" stroke-width="1.5"/><rect x="30" y="352" width="636" height="54" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="30" y="352" width="3" height="54" rx="1.5" fill="#34d399"/><circle cx="48" cy="378" r="11" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.6"/><text x="48" y="382" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">5</text><text x="74" y="372" font-size="12.5" font-weight="600" fill="#e6eef8">Acceptance gate</text><text x="74.0" y="388.0" font-size="10.6" fill="#94a3b8" text-anchor="start">A command with an expected result runs against the change; the evidence attaches to</text><text x="74.0" y="402.3" font-size="10.6" fill="#94a3b8" text-anchor="start">the pull request.</text><text x="656" y="372" font-size="9.5" fill="#34d399" text-anchor="end" letter-spacing="0.3">AUTOMATION</text><path d="M36 406 L36 414" stroke="#1e293b" stroke-width="1.5"/><path d="M32.5 410 L36 414.5 L39.5 410" fill="none" stroke="#1e293b" stroke-width="1.5"/><rect x="30" y="416" width="636" height="54" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="30" y="416" width="3" height="54" rx="1.5" fill="#60a5fa"/><circle cx="48" cy="442" r="11" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.6"/><text x="48" y="446" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">6</text><text x="74" y="436" font-size="12.5" font-weight="600" fill="#e6eef8">Independent review</text><text x="74.0" y="452.0" font-size="10.6" fill="#94a3b8" text-anchor="start">A second model and, where risk warrants, the operator return a verdict bound to an</text><text x="74.0" y="466.3" font-size="10.6" fill="#94a3b8" text-anchor="start">exact revision.</text><text x="656" y="436" font-size="9.5" fill="#60a5fa" text-anchor="end" letter-spacing="0.3">REVIEW</text><path d="M36 470 L36 478" stroke="#1e293b" stroke-width="1.5"/><path d="M32.5 474 L36 478.5 L39.5 474" fill="none" stroke="#1e293b" stroke-width="1.5"/><rect x="30" y="480" width="636" height="54" rx="7" fill="#0f1724" stroke="#1e293b"/><rect x="30" y="480" width="3" height="54" rx="1.5" fill="#8b5cf6"/><circle cx="48" cy="506" r="11" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.6"/><text x="48" y="510" font-size="11" font-weight="600" fill="#8b5cf6" text-anchor="middle">7</text><text x="74" y="500" font-size="12.5" font-weight="600" fill="#e6eef8">Disposition</text><text x="74.0" y="516.0" font-size="10.6" fill="#94a3b8" text-anchor="start">The outcome is recorded with a next owner: verified, delegated, deferred, or closed</text><text x="74.0" y="530.3" font-size="10.6" fill="#94a3b8" text-anchor="start">with a reason.</text><text x="656" y="500" font-size="9.5" fill="#8b5cf6" text-anchor="end" letter-spacing="0.3">DURABLE STATE</text><path d="M666 379.0 H690 V315.0 H670" fill="none" stroke="#f87171" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M675 311.5 L670 315.0 L675 318.5" fill="none" stroke="#f87171" stroke-width="1.6"/><path d="M666 507.0 H724 V187.0 H670" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="2 5"/><path d="M675 183.5 L670 187.0 L675 190.5" fill="none" stroke="#fbbf24" stroke-width="1.6"/><g transform="rotate(-90 682 345.0)"><rect x="611.8" y="338.0" width="140.4" height="12" rx="3" fill="#0b1220"/><text x="682" y="347.5" font-size="9" fill="#f87171" text-anchor="middle">failed check &#8594; retry</text></g><g transform="rotate(-90 716 245.0)"><rect x="679.8" y="238.0" width="72.3" height="12" rx="3" fill="#0b1220"/><text x="716" y="247.5" font-size="9" fill="#fbbf24" text-anchor="middle">adoption gap</text></g><circle cx="36" cy="570" r="4.5" fill="#fbbf24"/><text x="48" y="574" font-size="10.5" fill="#e6eef8">Amber marks a proposed follow-up in the next task.</text><text x="36" y="592" font-size="10" fill="#94a3b8">The audit recorded verdicts. It did not track their adoption in later tasks.</text><text x="36" y="608" font-size="10" fill="#64748b">The stages describe responsibilities. The audit did not trace every historical task through them.</text></svg>
