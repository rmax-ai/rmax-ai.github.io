<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="f3w-t f3w-d" style="font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="f3w-t">Recorded queue task states, without independent delivery verification</title><desc id="f3w-d">Of 1,078 tasks, 809 succeeded, 210 failed, 58 were cancelled and one was running. Queue states do not establish deployment or use.</desc><rect width="760" height="230" rx="10" fill="#0b1220"/><rect x="0.5" y="0.5" width="759" height="229" rx="10" fill="none" stroke="#1e293b"/><text x="34" y="38" font-size="15" font-weight="600" fill="#e6eef8">What the queue recorded, and what it cannot prove</text><text x="34" y="58" font-size="11" fill="#94a3b8">Task states at the November 18 cutoff. Deployment and use were not verified.</text><text x="34" y="118" font-size="12" font-weight="600" fill="#e6eef8">Recorded task states</text><text x="726" y="118" font-size="11" fill="#94a3b8" text-anchor="end">n = 1,078 tasks</text><rect x="34.0" y="132.0" width="519.3" height="44.0" fill="#34d399" fill-opacity="0.82"/><rect x="553.3" y="132.0" width="134.8" height="44.0" fill="#f87171" fill-opacity="0.82"/><rect x="688.1" y="132.0" width="37.2" height="44.0" fill="#64748b" fill-opacity="0.82"/><rect x="725.4" y="132.0" width="0.8" height="44.0" fill="#60a5fa" fill-opacity="0.82"/><text x="293.7" y="158.0" font-size="11.5" font-weight="600" fill="#08101c" text-anchor="middle">809 Succeeded</text><text x="620.7" y="158.0" font-size="11.5" font-weight="600" fill="#08101c" text-anchor="middle">210 Failed</text><path d="M725.7 176 L725.7 192" stroke="#60a5fa" stroke-width="1"/><text x="725.7" y="204" font-size="10" fill="#60a5fa" text-anchor="end">1 running (0.1%)</text><rect x="34.0" y="188.0" width="10" height="10" rx="2" fill="#34d399" fill-opacity="0.82"/><text x="49.0" y="196.0" font-size="10" fill="#94a3b8">Succeeded <tspan fill="#e6eef8" font-weight="600">809</tspan> (75.0%)</text><rect x="171.2" y="188.0" width="10" height="10" rx="2" fill="#f87171" fill-opacity="0.82"/><text x="186.2" y="196.0" font-size="10" fill="#94a3b8">Failed <tspan fill="#e6eef8" font-weight="600">210</tspan> (19.5%)</text><rect x="292.9" y="188.0" width="10" height="10" rx="2" fill="#64748b" fill-opacity="0.82"/><text x="307.9" y="196.0" font-size="10" fill="#94a3b8">Cancelled <tspan fill="#e6eef8" font-weight="600">58</tspan> (5.4%)</text></svg>
