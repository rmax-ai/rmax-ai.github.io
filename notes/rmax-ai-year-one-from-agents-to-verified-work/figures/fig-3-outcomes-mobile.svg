<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 432" width="380" height="432" role="img" aria-labelledby="f3m-t f3m-d" style="font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="f3m-t">Two outcome partitions with different denominators: 1,078 recorded tasks and 1,375 classified execution attempts</title><desc id="f3m-d">Panel A: of 1,078 recorded queue tasks, 809 succeeded, 210 failed, 58 were cancelled and 1 was running. Panel B: of 1,375 classified execution attempts, 810 succeeded, 518 failed acceptance and 47 ended in another non-success result, plus 5 unclassified records outside the total.</desc><rect width="380" height="432" rx="10" fill="#0b1220"/><rect x="0.5" y="0.5" width="379" height="431" rx="10" fill="none" stroke="#1e293b"/><text x="22" y="34" font-size="13.5" font-weight="600" fill="#e6eef8">What the queue recorded</text><text x="22" y="52" font-size="10.5" fill="#94a3b8">Two partitions. Each bar is 100% of its own total.</text><text x="22" y="84" font-size="11.5" font-weight="600" fill="#e6eef8">A. Recorded task states</text><text x="358" y="84" font-size="10.5" fill="#94a3b8" text-anchor="end">1,078 tasks</text><text x="22" y="108" font-size="9" fill="#60a5fa">1 running (0.1%) is too small to see.</text><rect x="22.0" y="118.0" width="252.2" height="34.0" fill="#34d399" fill-opacity="0.82"/><rect x="274.2" y="118.0" width="65.5" height="34.0" fill="#f87171" fill-opacity="0.82"/><rect x="339.6" y="118.0" width="18.1" height="34.0" fill="#64748b" fill-opacity="0.82"/><rect x="357.7" y="118.0" width="0.8" height="34.0" fill="#60a5fa" fill-opacity="0.82"/><rect x="22" y="164" width="9" height="9" rx="2" fill="#34d399" fill-opacity="0.82"/><text x="37" y="172" font-size="10.5" fill="#94a3b8">Succeeded <tspan fill="#e6eef8" font-weight="600">809</tspan> (75.0%)</text><rect x="22" y="179" width="9" height="9" rx="2" fill="#f87171" fill-opacity="0.82"/><text x="37" y="187" font-size="10.5" fill="#94a3b8">Failed <tspan fill="#e6eef8" font-weight="600">210</tspan> (19.5%)</text><rect x="22" y="194" width="9" height="9" rx="2" fill="#64748b" fill-opacity="0.82"/><text x="37" y="202" font-size="10.5" fill="#94a3b8">Cancelled <tspan fill="#e6eef8" font-weight="600">58</tspan> (5.4%)</text><rect x="22" y="209" width="9" height="9" rx="2" fill="#60a5fa" fill-opacity="0.82"/><text x="37" y="217" font-size="10.5" fill="#94a3b8">Running <tspan fill="#e6eef8" font-weight="600">1</tspan> (0.1%)</text><line x1="22" y1="226" x2="358" y2="226" stroke="#1e293b"/><text x="22" y="250" font-size="11.5" font-weight="600" fill="#e6eef8">B. Classified attempts</text><text x="358" y="250" font-size="10.5" fill="#94a3b8" text-anchor="end">1,375 attempts</text><rect x="22.0" y="264.0" width="197.9" height="34.0" fill="#34d399" fill-opacity="0.82"/><rect x="219.9" y="264.0" width="126.6" height="34.0" fill="#f87171" fill-opacity="0.82"/><rect x="346.5" y="264.0" width="11.5" height="34.0" fill="#64748b" fill-opacity="0.82"/><rect x="22" y="310" width="9" height="9" rx="2" fill="#34d399" fill-opacity="0.82"/><text x="37" y="318" font-size="10.5" fill="#94a3b8">Succeeded <tspan fill="#e6eef8" font-weight="600">810</tspan> (58.9%)</text><rect x="22" y="325" width="9" height="9" rx="2" fill="#f87171" fill-opacity="0.82"/><text x="37" y="333" font-size="10.5" fill="#94a3b8">Acceptance failed <tspan fill="#e6eef8" font-weight="600">518</tspan> (37.7%)</text><rect x="22" y="340" width="9" height="9" rx="2" fill="#64748b" fill-opacity="0.82"/><text x="37" y="348" font-size="10.5" fill="#94a3b8">Other non-success <tspan fill="#e6eef8" font-weight="600">47</tspan> (3.4%)</text><text x="22" y="379" font-size="9.5" fill="#fbbf24">+5 records carry an unclassified result, outside the total.</text><text x="22" y="395" font-size="9.5" fill="#64748b">Success is a queue state, not proof of a shipped result.</text></svg>
