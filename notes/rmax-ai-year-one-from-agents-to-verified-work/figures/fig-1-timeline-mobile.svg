<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 812" width="380" height="812" role="img" aria-labelledby="f1m-t f1m-d" style="font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="f1m-t">Seven phases of the RMax AI operating model, November 2025 to November 18, 2026</title><desc id="f1m-d">A stacked timeline. November 2025 is marked as operator account only, with no surviving artifact. April 2026 is marked as a dormancy observed in the records: zero indexed commits and 30 heartbeat-only sessions.</desc><rect width="380" height="812" rx="10" fill="#0b1220"/><rect x="0.5" y="0.5" width="379" height="811" rx="10" fill="none" stroke="#1e293b"/><text x="24" y="38" font-size="14" font-weight="600" fill="#e6eef8">Seven phases</text><text x="24" y="56" font-size="11" fill="#94a3b8">Nov 2025 - Nov 18, 2026</text><line x1="29" y1="74" x2="29" y2="728.0" stroke="#1e293b"/><circle cx="29" cy="92" r="4.5" fill="#fbbf24"/><text x="44" y="88" font-size="9" fill="#fbbf24" letter-spacing="0.5">NOV 2025</text><text x="44" y="105" font-size="12.5" font-weight="600" fill="#e6eef8">Origin, no artifact</text><text x="44.0" y="122.0" font-size="12.0" fill="#94a3b8" text-anchor="start">The initiative's starting point exists only in the</text><text x="44.0" y="139.4" font-size="12.0" fill="#94a3b8" text-anchor="start">operator's account.</text><circle cx="29" cy="168.0" r="4.5" fill="#60a5fa"/><text x="44" y="164.0" font-size="9" fill="#60a5fa" letter-spacing="0.5">DEC 2025 - JAN 2026</text><text x="44" y="181.0" font-size="12.5" font-weight="600" fill="#e6eef8">Foundations</text><text x="44.0" y="198.0" font-size="12.0" fill="#94a3b8" text-anchor="start">Repository and site from Dec 23; first public note</text><text x="44.0" y="215.4" font-size="12.0" fill="#94a3b8" text-anchor="start">Jan 3; execution contracts and earned autonomy</text><text x="44.0" y="232.8" font-size="12.0" fill="#94a3b8" text-anchor="start">established; earliest agent-workspace records Jan</text><text x="44.0" y="250.2" font-size="12.0" fill="#94a3b8" text-anchor="start">31.</text><circle cx="29" cy="280.0" r="4.5" fill="#8b5cf6"/><text x="44" y="276.0" font-size="9" fill="#8b5cf6" letter-spacing="0.5">FEB - MAR 2026</text><text x="44" y="293.0" font-size="12.5" font-weight="600" fill="#e6eef8">Portfolio expansion</text><text x="44.0" y="310.0" font-size="12.0" fill="#94a3b8" text-anchor="start">Autonomous editing, a book project, workflow</text><text x="44.0" y="327.4" font-size="12.0" fill="#94a3b8" text-anchor="start">experiments and an application prototype. Commit</text><text x="44.0" y="344.8" font-size="12.0" fill="#94a3b8" text-anchor="start">volume rises; it does not prove finished products.</text><circle cx="29" cy="374.0" r="4.5" fill="#f87171"/><text x="44" y="370.0" font-size="9" fill="#f87171" letter-spacing="0.5">APR 2026</text><text x="44" y="387.0" font-size="12.5" font-weight="600" fill="#e6eef8">Dormancy</text><text x="44.0" y="404.0" font-size="12.0" fill="#94a3b8" text-anchor="start">Zero indexed commits or issues; 30 heartbeat-only</text><text x="44.0" y="421.4" font-size="12.0" fill="#94a3b8" text-anchor="start">sessions. The records show a pause, not its cause.</text><circle cx="29" cy="450.0" r="4.5" fill="#8b5cf6"/><text x="44" y="446.0" font-size="9" fill="#8b5cf6" letter-spacing="0.5">MAY - JUL 2026</text><text x="44" y="463.0" font-size="12.5" font-weight="600" fill="#e6eef8">Platform rebuild</text><text x="44.0" y="480.0" font-size="12.0" fill="#94a3b8" text-anchor="start">Runtime migration on May 11; scheduled work and</text><text x="44.0" y="497.4" font-size="12.0" fill="#94a3b8" text-anchor="start">knowledge pipelines expand; governed research and</text><text x="44.0" y="514.8" font-size="12.0" fill="#94a3b8" text-anchor="start">bounded loops become a cluster.</text><circle cx="29" cy="544.0" r="4.5" fill="#8b5cf6"/><text x="44" y="540.0" font-size="9" fill="#8b5cf6" letter-spacing="0.5">AUG - OCT 2026</text><text x="44" y="557.0" font-size="12.5" font-weight="600" fill="#e6eef8">Control plane</text><text x="44.0" y="574.0" font-size="12.0" fill="#94a3b8" text-anchor="start">Media, telemetry and a tool gateway, then</text><text x="44.0" y="591.4" font-size="12.0" fill="#94a3b8" text-anchor="start">delegation, a second-model request channel, system</text><text x="44.0" y="608.8" font-size="12.0" fill="#94a3b8" text-anchor="start">review and architecture records.</text><circle cx="29" cy="638.0" r="4.5" fill="#8b5cf6"/><text x="44" y="634.0" font-size="9" fill="#8b5cf6" letter-spacing="0.5">NOV 1 - 18 2026</text><text x="44" y="651.0" font-size="12.5" font-weight="600" fill="#e6eef8">Verification debt</text><text x="44.0" y="668.0" font-size="12.0" fill="#94a3b8" text-anchor="start">Maintenance, evaluation and self-audit surface</text><text x="44.0" y="685.4" font-size="12.0" fill="#94a3b8" text-anchor="start">acceptance failures and maintenance cost. The</text><text x="44.0" y="702.8" font-size="12.0" fill="#94a3b8" text-anchor="start">window closes Nov 18.</text><circle cx="28" cy="750.0" r="3.5" fill="#8b5cf6"/><text x="38" y="753.4" font-size="9.5" fill="#94a3b8">Repository evidence</text><circle cx="28" cy="765.0" r="3.5" fill="#60a5fa"/><text x="38" y="768.4" font-size="9.5" fill="#94a3b8">Repository + operator account</text><circle cx="28" cy="780.0" r="3.5" fill="#fbbf24"/><text x="38" y="783.4" font-size="9.5" fill="#94a3b8">Operator account only</text><circle cx="28" cy="795.0" r="3.5" fill="#f87171"/><text x="38" y="798.4" font-size="9.5" fill="#94a3b8">Observed gap in records</text></svg>
