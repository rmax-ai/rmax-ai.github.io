<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 663" width="760" height="663" role="img" aria-labelledby="f1w-t f1w-d" style="font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="f1w-t">Seven phases of the RMax AI operating model, November 2025 to November 18, 2026</title><desc id="f1w-d">A vertical timeline. November 2025 is marked as operator account only, with no surviving artifact. April 2026 is marked as a dormancy observed in the records: zero indexed commits and 30 heartbeat-only sessions. The remaining phases are supported by repository evidence.</desc><rect width="760" height="663" rx="10" fill="#0b1220"/><rect x="0.5" y="0.5" width="759" height="662" rx="10" fill="none" stroke="#1e293b"/><text x="30" y="40" font-size="15" font-weight="600" fill="#e6eef8">Seven phases of the operating model</text><text x="30" y="60" font-size="11" fill="#94a3b8">November 2025 to November 18, 2026</text><line x1="30" y1="70" x2="30" y2="589.2" stroke="#1e293b"/><circle cx="30" cy="98" r="5" fill="#fbbf24"/><rect x="44" y="86" width="2.5" height="38" fill="#fbbf24" opacity="0.5"/><text x="58" y="94" font-size="12" font-weight="600" fill="#e6eef8">Origin, no artifact</text><text x="58" y="111" font-size="9.5" fill="#94a3b8" letter-spacing="0.3">NOV 2025</text><text x="214.0" y="93.0" font-size="11.4" fill="#94a3b8" text-anchor="start">The initiative's starting point exists only in the operator's account.</text><circle cx="30" cy="164" r="5" fill="#60a5fa"/><rect x="44" y="152" width="2.5" height="48.2" fill="#60a5fa" opacity="0.5"/><text x="58" y="160" font-size="12" font-weight="600" fill="#e6eef8">Foundations</text><text x="58" y="177" font-size="9.5" fill="#94a3b8" letter-spacing="0.3">DEC 2025 - JAN 2026</text><text x="214.0" y="159.0" font-size="11.4" fill="#94a3b8" text-anchor="start">Repository and site from Dec 23; first public note Jan 3; execution contracts and</text><text x="214.0" y="175.5" font-size="11.4" fill="#94a3b8" text-anchor="start">earned autonomy established; earliest agent-workspace records Jan 31.</text><circle cx="30" cy="240.2" r="5" fill="#8b5cf6"/><rect x="44" y="228.2" width="2.5" height="48.2" fill="#8b5cf6" opacity="0.5"/><text x="58" y="236.2" font-size="12" font-weight="600" fill="#e6eef8">Portfolio expansion</text><text x="58" y="253.2" font-size="9.5" fill="#94a3b8" letter-spacing="0.3">FEB - MAR 2026</text><text x="214.0" y="235.2" font-size="11.4" fill="#94a3b8" text-anchor="start">Autonomous editing, a book project, workflow experiments and an application prototype.</text><text x="214.0" y="251.7" font-size="11.4" fill="#94a3b8" text-anchor="start">Commit volume rises; it does not prove finished products.</text><circle cx="30" cy="316.4" r="5" fill="#f87171"/><rect x="44" y="304.4" width="2.5" height="48.2" fill="#f87171" opacity="0.5"/><text x="58" y="312.4" font-size="12" font-weight="600" fill="#e6eef8">Dormancy</text><text x="58" y="329.4" font-size="9.5" fill="#94a3b8" letter-spacing="0.3">APR 2026</text><text x="214.0" y="311.4" font-size="11.4" fill="#94a3b8" text-anchor="start">Zero indexed commits or issues; 30 heartbeat-only sessions. The records show a pause,</text><text x="214.0" y="327.9" font-size="11.4" fill="#94a3b8" text-anchor="start">not its cause.</text><circle cx="30" cy="392.59999999999997" r="5" fill="#8b5cf6"/><rect x="44" y="380.59999999999997" width="2.5" height="48.2" fill="#8b5cf6" opacity="0.5"/><text x="58" y="388.59999999999997" font-size="12" font-weight="600" fill="#e6eef8">Platform rebuild</text><text x="58" y="405.59999999999997" font-size="9.5" fill="#94a3b8" letter-spacing="0.3">MAY - JUL 2026</text><text x="214.0" y="387.6" font-size="11.4" fill="#94a3b8" text-anchor="start">Runtime migration on May 11; scheduled work and knowledge pipelines expand; governed</text><text x="214.0" y="404.1" font-size="11.4" fill="#94a3b8" text-anchor="start">research and bounded loops become a cluster.</text><circle cx="30" cy="468.79999999999995" r="5" fill="#8b5cf6"/><rect x="44" y="456.79999999999995" width="2.5" height="48.2" fill="#8b5cf6" opacity="0.5"/><text x="58" y="464.79999999999995" font-size="12" font-weight="600" fill="#e6eef8">Control plane</text><text x="58" y="481.79999999999995" font-size="9.5" fill="#94a3b8" letter-spacing="0.3">AUG - OCT 2026</text><text x="214.0" y="463.8" font-size="11.4" fill="#94a3b8" text-anchor="start">Media, telemetry and a tool gateway, then delegation, a second-model request channel,</text><text x="214.0" y="480.3" font-size="11.4" fill="#94a3b8" text-anchor="start">system review and architecture records.</text><circle cx="30" cy="545.0" r="5" fill="#8b5cf6"/><rect x="44" y="533.0" width="2.5" height="48.2" fill="#8b5cf6" opacity="0.5"/><text x="58" y="541.0" font-size="12" font-weight="600" fill="#e6eef8">Verification debt</text><text x="58" y="558.0" font-size="9.5" fill="#94a3b8" letter-spacing="0.3">NOV 1 - 18 2026</text><text x="214.0" y="540.0" font-size="11.4" fill="#94a3b8" text-anchor="start">Maintenance, evaluation and self-audit surface acceptance failures and maintenance</text><text x="214.0" y="556.5" font-size="11.4" fill="#94a3b8" text-anchor="start">cost. The window closes Nov 18.</text><circle cx="34" cy="611.2" r="4" fill="#8b5cf6"/><text x="45" y="614.8000000000001" font-size="10" fill="#94a3b8">Repository evidence</text><circle cx="168.85000000000002" cy="611.2" r="4" fill="#60a5fa"/><text x="179.85000000000002" y="614.8000000000001" font-size="10" fill="#94a3b8">Repository + operator account</text><circle cx="355.20000000000005" cy="611.2" r="4" fill="#fbbf24"/><text x="366.20000000000005" y="614.8000000000001" font-size="10" fill="#94a3b8">Operator account only</text><circle cx="500.35" cy="611.2" r="4" fill="#f87171"/><text x="511.35" y="614.8000000000001" font-size="10" fill="#94a3b8">Observed gap in records</text><text x="30" y="633.2" font-size="10" fill="#64748b">Phases are categorical; widths carry no proportional meaning.</text></svg>
