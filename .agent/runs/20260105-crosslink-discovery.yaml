proposed_links:
  - from: notes/agent-execution-contracts/index.md
    to: notes/authority-first-agent-architecture/index.md
    type: extends
    confidence: 0.95
    rationale: >
      Both address the shift from "prompt-driven" to "constraint-driven" engineering. 
      'Execution Contracts' define the granular, task-specific invariants, while 
      'Authority-First Architecture' provides the systemic decoupling (the enforcer) 
      required to make those contracts operationally binding.
    evidence:
      - note_a: "Execution contracts are the necessary evolution of software artifacts where specifications and tests become the binding constraints for autonomous labor."
      - note_b: "In an authority-first architecture, the agent generates a proposal. This proposal is intercepted by an external authority system that evaluates it against a static specification before execution."
    suggested_anchor: "architectural enforcement of execution boundaries"

  - from: notes/agent-first-software-engineering/index.md
    to: notes/failure-oriented-orchestration/index.md
    type: extends
    confidence: 0.95
    rationale: >
      The Jan 4th note (Failure-Oriented) refines the high-level Jan 3rd 
      workflow (Agent-First) by providing specific operational control 
      primitives like Phase Ledgers and Invariant Maps to handle non-deterministic 
      agent failure.
    evidence:
      - note_a: "The limiting factor is boundary quality: problem definitions, invariants, interfaces, and acceptance criteria."
      - note_b: "Trust must be engineered through explicit control primitives that bound agent behavior and ensure state recoverability."
    suggested_anchor: "operational implementation of failure-oriented boundaries"

  - from: notes/agent-execution-contracts/index.md
