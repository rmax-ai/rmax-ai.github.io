      - note_b: "Authority should be granted in scoped, revocable increments, gated by the agent's ability to maintain system invariants and operate within explicit execution contracts."
    suggested_anchor: "technical enforcement for the Autonomy Ladder"

  - from: notes/agent-first-software-engineering/index.md
